@if(authService.cargando){

<div class="loading">

  <h2>Cargando...</h2>

  <div class="spinner"></div>

</div>

}
@else {


@if(authService.logueoExitoso){


<div class="navigation-bar">

  <button routerLink="publicaciones">
    Publicaciones
  </button>


  <button [routerLink]="['/perfil', authService.usuarioLogueado?._id]">
    Mi perfil
  </button>

  @if(authService.usuarioLogueado?.perfil == "administrador"){

  <button routerLink="usuarios">
    Usuarios
  </button>

  <button routerLink="estadisticas">
    Estadisticas
  </button>

  }


  <button (click)="cerrarSesion()">
    Cerrar sesión
  </button>


</div>


}
@else {


<div class="navigation-bar">


  <button routerLink="/auth/login">
    Iniciar sesión
  </button>


  <button routerLink="/auth/registrarse">
    Registrarse
  </button>


</div>


}


@if(sesionService.mostrarModal){


<div class="modal-sesion">

  <div class="contenido-modal">

    <h2>
      Sesión próxima a vencer
    </h2>


    <p>
      Quedan 5 minutos de sesión.
      ¿Desea extender la sesión?
    </p>


    <button (click)="extenderSesion()">
      Extender sesión
    </button>


    <button (click)="cerrarSesion()">
      Cerrar sesión
    </button>


  </div>

</div>


}



<div class="router-outlet-class">

  <router-outlet></router-outlet>

</div>


}

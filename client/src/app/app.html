@if(authService.cargando){

<div class="loading">

  <h2>Cargando...</h2>

  <div class="spinner"></div>

</div>

}
@else {


@if(authService.logueoExitoso){


<div class="navigation-bar">

  <button routerLink="publicaciones">
    Publicaciones
  </button>


  <button [routerLink]="['/perfil', authService.usuarioLogueado?._id]">
    Mi perfil
  </button>


  <button (click)="cerrarSesion()">
    Cerrar sesión
  </button>


</div>


}
@else {


<div class="navigation-bar">


  <button routerLink="/auth/login">
    Iniciar sesión
  </button>


  <button routerLink="/auth/registrarse">
    Registrarse
  </button>


</div>


}


<router-outlet></router-outlet>


}

<div class="ordenar-por">
    <p>Ordenar por:</p>
    <button (click)="ordenarPorFecha()">Fecha</button>
    <button (click)="ordenarPorLikes()">Likes</button>
</div>

<div appResaltar class="lista-publicaciones">

    @for(publicacion of publicaciones; track $index){

    <div class="preview-publicacion" [routerLink]="['/publicaciones', publicacion._id]">

        <h3 appAgrandarLetra>
            {{publicacion.nombreDeUsuario}}
        </h3>

        <img [src]="publicacion.contenido" alt="imagen publicacion">

        <span>
            Likes: {{publicacion.likes.length}}
        </span>

        <span>
            {{publicacion.fecha | formatoFecha}}
        </span>

    </div>

    }

</div>

<div class="paginacion">

    @if(paginaActual > 1){
    <button (click)="paginaAnterior()">
        Página anterior
    </button>
    }

    <span class="pagina-actual">
        Página {{ paginaActual }}
    </span>

    @if(hayPaginaSiguiente()){
    <button (click)="siguientePagina()">
        Página siguiente
    </button>
    }

</div>

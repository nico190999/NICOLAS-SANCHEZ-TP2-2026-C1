<div class="publicacion">

    <div class="cabecera">
        <h3>{{ nombreDeUsuario }}</h3>
    </div>

    <div class="contenido">
        <p>{{ contenido }}</p>
    </div>

    <div class="detalles">

        <span class="fecha">
            {{ fecha }}
        </span>

        <span class="likes">
            {{ likes }} Me gusta
        </span>

    </div>

    @if(!usuarioYaDioLike()){
    <button (click)="darLike()">Me gusta</button>
    }

    @if(usuarioYaDioLike()){
    <button (click)="quitarLike()">Quitar Me gusta</button>
    }

    <div class="descripcion">
        <p>{{ descripcion }}</p>
    </div>

    <div class="comentarios">
        <h4>Comentarios ({{ comentarios }})</h4>
    </div>

    @if(esMia()){
    <button (click)="eliminarPublicacion()">Eliminar Publicación
    </button>
    }

</div>

<form class="form" [formGroup]="formulario" (ngSubmit)="login()">
    <p class="title">Iniciar Sesión </p>
            
    <label>
        <input 
        required="" 
        placeholder="" 
        type="email" 
        class="input"
        formControlName="correo">
        <span>Email</span>
    </label> 
        
    <label>
        <input 
        required="" 
        placeholder="" 
        type="password" 
        class="input"
        formControlName="contrasenia"
        >
        <span>Contraseña</span>
    </label>
    <button (click)="loginRapido()">Login Rapido</button>
    <button type="submit" class="submit">Iniciar Sesión</button>
</form>
